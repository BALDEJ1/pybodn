[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[project]
name = "pybodn"
version = "0.2.0"
description = "Store the memories of an AI agent or app in a local SQLite file and search them by words, or by meaning with your own embedding model."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "BALDEJ1" }]
keywords = [
  "memory", "agent-memory", "ai-memory", "retrieval", "search", "semantic-search", "sqlite"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# Search by meaning computes with NumPy; without an embedding model it is never imported.
vector = ["numpy>=2.0"]

[project.urls]
Homepage = "https://github.com/BALDEJ1/pybodn"
Repository = "https://github.com/BALDEJ1/pybodn"
Issues = "https://github.com/BALDEJ1/pybodn/issues"
Changelog = "https://github.com/BALDEJ1/pybodn/blob/main/CHANGELOG.md"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests", "benchmarks"]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]

[tool.coverage.run]
source_pkgs = ["pybodn"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true

[dependency-groups]
dev = [
    "coverage>=7.17.3",
    "mypy>=2.4.1",
    "prek>=0.5.10",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
# The tests and type checks need NumPy; the CI job that checks pybodn without it leaves this out.
vector = ["pybodn[vector]"]

[tool.uv]
default-groups = ["dev", "vector"]
