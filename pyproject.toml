[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[project]
name = "pybodn"
version = "0.1.0"
description = "A foundational memory engine for intelligent systems."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "BALDEJ1" }]
keywords = ["memory", "agent-memory", "ai-memory", "index", "retrieval"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/BALDEJ1/pybodn"
Repository = "https://github.com/BALDEJ1/pybodn"
Issues = "https://github.com/BALDEJ1/pybodn/issues"
Changelog = "https://github.com/BALDEJ1/pybodn/blob/main/CHANGELOG.md"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]

[tool.coverage.run]
source_pkgs = ["pybodn"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[dependency-groups]
dev = [
    "coverage>=7.17.3",
    "mypy>=2.4.1",
    "prek>=0.5.10",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
