# Secret and workflow checks. Install once with: uv run prek install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      # Before each commit: the staged changes.
      - id: gitleaks
      # CI only: the whole history, same gitleaks version.
      - id: gitleaks
        alias: gitleaks-history
        name: gitleaks (full history)
        entry: gitleaks git --redact --verbose
        stages: [manual]
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7  # frozen: v1.32.0
    hooks:
      - id: zizmor
