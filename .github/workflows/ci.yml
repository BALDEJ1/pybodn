name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run coverage run -m pytest
      - run: uv run coverage report

  without-numpy:
    # pybodn as installed without its "vector" extra: everything but search by meaning works, and
    # the tests of search by meaning are skipped.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.12"
      - run: uv sync --locked --no-group vector
      - name: Check that NumPy is not installed
        run: >-
          uv run --no-sync python -c
          "import importlib.util; assert importlib.util.find_spec('numpy') is None"
      - run: uv run --no-sync pytest

  oldest-sqlite:
    # Python 3.12 as Red Hat Enterprise Linux 9 ships it, with SQLite 3.34: the oldest SQLite
    # pybodn is tested on. The other jobs use uv's Python, which brings a recent SQLite along.
    runs-on: ubuntu-latest
    container:
      image: rockylinux/rockylinux:9@sha256:8101994123cf3d0a8fee517bee7f39e555c7d92bd2d9eb3303cc988a0eeed00f
      # The image sets no PATH. Without one, the steps after setup-uv get a PATH that holds only
      # uv's folder, and not even sh is found.
      env:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - run: dnf install -y python3.12
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
      - run: uv sync --locked --python /usr/bin/python3.12
      - name: Check that the tests will run on the old SQLite
        run: >-
          uv run python -c
          "import sqlite3; assert sqlite3.sqlite_version_info < (3, 35), sqlite3.sqlite_version"
      - run: uv run pytest

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.12"
      - run: uv sync --locked
      - name: Scan the whole git history for secrets
        run: uv run prek run --verbose --hook-stage manual gitleaks-history --all-files
      - name: Audit the workflows (online checks need the read-only job token)
        run: uv run prek run --verbose zizmor --all-files
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.12"
      - run: uv build
      - run: uvx twine==7.0.0 check --strict dist/*
      - name: Run the README examples against the wheel in a clean environment
        run: >-
          uv run --isolated --no-project --with dist/*.whl --with pytest==9.2.0
          pytest -p no:cacheprovider tests/test_readme.py
